<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevStack</title>
    <!-- tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- Navbar starts -->
    <nav class="sticky top-0 z-50 border-b border-gray-200 bg-white">
      <div
        class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8"
      >
        <!-- Left: Mobile Menu + Brand -->
        <div class="flex items-center gap-3">
          <!-- Mobile Hamburger -->
          <button
            class="flex h-9 w-9 items-center justify-center rounded-md text-gray-700 hover:bg-gray-100 md:hidden"
            aria-label="Open menu"
          >
            <!-- Hamburger Icon -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>

          <!-- Brand -->
          <a href="#" class="flex items-center gap-2">
            <!-- Logo -->
            <div
              class="flex h-7 w-7 items-center justify-center rounded-md bg-gradient-to-br from-orange-400 via-pink-500 to-violet-600 text-xs font-bold text-white"
            >
              D
            </div>

            <!-- Brand Name -->
            <span
              class="bg-gradient-to-r from-orange-400 via-pink-500 to-violet-600 bg-clip-text text-sm font-bold text-transparent"
            >
              Dev Stack
            </span>
          </a>
        </div>

        <!-- Center: Navigation Links -->
        <div class="hidden items-center gap-7 md:flex">
          <a
            href="#home"
            class="text-xs font-medium text-gray-600 transition hover:text-pink-500"
          >
            Home
          </a>

          <a
            href="#technologies"
            class="text-xs font-medium text-gray-600 transition hover:text-pink-500"
          >
            Technologies
          </a>

          <a
            href="#projects"
            class="text-xs font-medium text-gray-600 transition hover:text-pink-500"
          >
            Projects
          </a>

          <a
            href="#about"
            class="text-xs font-medium text-gray-600 transition hover:text-pink-500"
          >
            About
          </a>

          <a
            href="#contact"
            class="text-xs font-medium text-gray-600 transition hover:text-pink-500"
          >
            Contact
          </a>
        </div>

        <!-- Right: Authentication -->
        <div class="flex items-center gap-2">
          <!-- Sign In -->
          <button
            class="hidden text-xs font-medium text-gray-600 transition hover:text-pink-500 sm:block"
          >
            Sign In
          </button>

          <!-- Sign Up -->
          <button
            class="rounded-full bg-gradient-to-r from-orange-400 via-pink-500 to-violet-600 px-4 py-2 text-xs font-semibold text-white shadow-sm transition hover:opacity-90"
          >
            Sign Up
          </button>
        </div>
      </div>
    </nav>
    <!-- Navbar ends -->
  </body>
</html>
