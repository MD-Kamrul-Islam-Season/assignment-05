<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevStack</title>
    <!-- css link -->
    <link rel="stylesheet" href="style.css" />
    <!-- tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!--google font: inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navbar starts -->
    <nav class="sticky top-0 z-50 border-b border-gray-200 bg-white">
      <div
        class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8"
      >
        <!-- Left: Mobile Menu + Brand -->
        <div class="flex items-center gap-3">
          <!-- Mobile Hamburger -->
          <button
            class="flex h-9 w-9 items-center justify-center rounded-md text-gray-700 hover:bg-gray-100 md:hidden"
            aria-label="Open menu"
          >
            <!-- Hamburger Icon -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>

          <!-- Brand -->
          <a href="#" class="flex items-center gap-2">
            <!-- Logo -->
            <div class="ml-20 md:ml-0">
              <img src="./images/logo-text.png" alt="banner" />
            </div>
          </a>
        </div>

        <!-- Center: Navigation Links -->
        <div class="hidden items-center gap-7 md:flex">
          <a
            href="#home"
            class="text-xs font-medium text-gray-600 transition hover:text-pink-500"
          >
            Home
          </a>

          <a
            href="#technologies"
            class="text-xs font-medium text-gray-600 transition hover:text-pink-500"
          >
            Technologies
          </a>

          <a
            href="#projects"
            class="text-xs font-medium text-gray-600 transition hover:text-pink-500"
          >
            Projects
          </a>

          <a
            href="#about"
            class="text-xs font-medium text-gray-600 transition hover:text-pink-500"
          >
            About
          </a>

          <a
            href="#contact"
            class="text-xs font-medium text-gray-600 transition hover:text-pink-500"
          >
            Contact
          </a>
        </div>

        <!-- Right: Authentication -->
        <div class="flex items-center gap-2">
          <!-- Sign In -->
          <button
            class="text-xs font-medium text-gray-600 transition hover:text-pink-500 sm:block"
          >
            Sign In
          </button>

          <!-- Sign Up -->
          <button
            class="rounded-full bg-gradient-to-r from-orange-400 via-pink-500 to-violet-600 px-4 py-2 text-xs font-semibold text-white shadow-sm transition hover:opacity-90"
          >
            Sign Up
          </button>
        </div>
      </div>
    </nav>
    <!-- Navbar ends -->

    <!-- Hero section starts -->
    <section id="home" class="bg-white">
      <div
        class="mx-auto flex min-h-[520px] max-w-7xl items-center px-4 py-16 sm:px-6 lg:px-8"
      >
        <!-- Hero Content -->
        <div
          class="flex w-full flex-col-reverse items-center justify-between gap-10 md:flex-row"
        >
          <!-- Left: Text Content -->
          <div
            class="w-full text-center md:w-1/2 md:text-left md:order-1 order-2"
          >
            <!-- Heading -->
            <h1
              class="inter-font text-4xl font-bold leading-tight text-gray-900 sm:text-5xl lg:text-6xl"
            >
              Build Your Ideal
              <span
                class="bg-gradient-to-r from-orange-400 via-pink-500 to-violet-600 bg-clip-text text-transparent"
              >
                Development Stack
              </span>
            </h1>

            <!-- Description -->
            <p
              class="mx-auto mt-5 max-w-xl text-sm leading-6 text-gray-500 md:mx-0"
            >
              Explore frontend, backend, database, and tooling options. Compare
              them side-by-side, and put together the stack that fits your next
              project.
            </p>

            <!-- Buttons -->
            <div
              class="mt-7 flex flex-row md:justify-start justify-center items-center gap-3 md:items-start"
            >
              <!-- Explore Technologies -->
              <a
                href="#technologies"
                class="rounded-md bg-gradient-to-r from-orange-400 via-pink-500 to-violet-600 px-5 py-3 text-xs font-semibold text-white shadow-sm transition hover:opacity-90"
              >
                <button>Explore Technologies</button>
              </a>

              <!-- Learn More -->
              <a
                href="#about"
                class="rounded-md border border-gray-300 bg-white px-5 py-3 text-xs font-semibold text-gray-600 transition hover:border-pink-400 hover:text-pink-500"
              >
                <button>Learn More</button>
              </a>
            </div>
          </div>

          <!-- Right: Hero Image -->
          <div
            class="flex w-full justify-center md:w-1/2 md:justify-end md:order-2 order-1"
          >
            <div class="relative">
              <img
                src="./images/banner-stack.png"
                alt="Development stack illustration"
                class="w-[500px]"
              />
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Hero section ends -->
  </body>
</html>
